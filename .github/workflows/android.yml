
name: Build ALI SHAMS CONTROL

on:
  workflow_dispatch:
  push:
    paths:
      - 'ALI_SHAMS_CONTROL_FIXED.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="ALI_SHAMS_CONTROL_FIXED.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALI-SHAMS-CONTROL-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
